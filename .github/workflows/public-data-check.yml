name: Public data check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public data
        env:
          DENYLIST_CONTENT: ${{ secrets.PUBLIC_DATA_DENYLIST }}
        run: |
          umask 077
          DENY="$RUNNER_TEMP/denylist"
          printf '%s' "$DENYLIST_CONTENT" > "$DENY"
          PUBLIC_DATA_DENYLIST="$DENY" python scripts/check_public_data.py tests src
          rm -f "$DENY"
